<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#102a43">
  <title>کنترل صفحه گوشی</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, Tahoma, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1724; color: #edf2f7; display: flex; flex-direction: column; }
    header { padding: 14px 18px; background: #102a43; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header strong { font-size: 17px; }
    #state { color: #b8c7d9; font-size: 13px; }
    main { width: min(100%, 1100px); margin: 0 auto; padding: 14px; display: flex; flex: 1; flex-direction: column; gap: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button { border: 0; border-radius: 10px; background: #1769aa; color: white; padding: 10px 15px; font: inherit; cursor: pointer; }
    button.secondary { background: #334e68; }
    button:disabled { opacity: .45; cursor: default; }
    #screenWrap { display: flex; flex: 1; min-height: 200px; max-height: calc(100vh - 160px); justify-content: center; align-items: center; background: #000; border: 1px solid #334e68; border-radius: 12px; overflow: hidden; }
    video { max-width: 100%; max-height: calc(100vh - 170px); width: 100%; height: 100%; object-fit: contain; touch-action: none; user-select: none; -webkit-user-select: none; }
    #hint { color: #9fb3c8; font-size: 13px; line-height: 1.7; margin: 0; }
    @media (orientation: portrait) { #screenWrap { max-height: 76vh; } video { max-height: 76vh; } }
  </style>
</head>
<body>
  <header>
    <strong>کنترل صفحه گوشی از طریق Wi‑Fi</strong>
    <span id="state">آماده اتصال</span>
  </header>
  <main>
    <div class="toolbar">
      <button id="connect">اتصال به گوشی</button>
      <button class="secondary" id="back">بازگشت</button>
      <button class="secondary" id="home">خانه</button>
      <button class="secondary" id="recents">برنامه‌های اخیر</button>
      <button class="secondary" id="fullscreen">تمام‌صفحه</button>
    </div>
    <div id="screenWrap"><video id="screen" autoplay playsinline muted></video></div>
    <p id="hint">بعد از اتصال، روی تصویر کلیک کنید یا لمس/درگ انجام دهید. برای کنترل لمس باید سرویس Accessibility را در گوشی فعال کرده باشید.</p>
  </main>
<script>
(() => {
  const stateEl = document.getElementById('state');
  const connectButton = document.getElementById('connect');
  const video = document.getElementById('screen');
  let peer = null;
  let pointerStart = null;

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const setState = text => { stateEl.textContent = text; };

  function waitForIceGathering(pc, timeoutMs = 15000) {
    if (pc.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      };
      const check = () => { if (pc.iceGatheringState === 'complete') finish(); };
      pc.addEventListener('icegatheringstatechange', check);
      setTimeout(finish, timeoutMs);
    });
  }

  async function connect() {
    connectButton.disabled = true;
    setState('در حال مذاکره WebRTC…');
    try {
      if (peer) peer.close();
      peer = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
        bundlePolicy: 'max-bundle'
      });
      peer.addTransceiver('video', { direction: 'recvonly' });
      peer.ontrack = event => {
        const stream = event.streams && event.streams[0];
        if (stream) video.srcObject = stream;
      };
      peer.oniceconnectionstatechange = () => {
        const s = peer ? peer.iceConnectionState : 'closed';
        if (s === 'connected' || s === 'completed') setState('متصل • تصویر زنده');
        else if (s === 'failed') setState('اتصال ناموفق؛ Wi‑Fi و محدودیت شبکه را بررسی کنید');
        else if (s === 'disconnected') setState('ارتباط قطع شد؛ در حال تلاش مجدد…');
        else setState('وضعیت WebRTC: ' + s);
      };

      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);
      await waitForIceGathering(peer);

      const response = await fetch('/offer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'offer', sdp: peer.localDescription.sdp })
      });
      if (!response.ok) throw new Error('ارسال پیشنهاد ناموفق بود: ' + response.status);

      let answer = null;
      for (let i = 0; i < 70; i++) {
        const answerResponse = await fetch('/answer?ts=' + Date.now(), { cache: 'no-store' });
        if (answerResponse.ok) {
          const payload = await answerResponse.json();
          if (payload.type === 'answer' && payload.sdp) { answer = payload; break; }
        }
        await sleep(300);
      }
      if (!answer) throw new Error('پاسخ WebRTC از گوشی دریافت نشد.');
      await peer.setRemoteDescription({ type: 'answer', sdp: answer.sdp });
      setState('پاسخ دریافت شد؛ در حال اتصال…');
    } catch (error) {
      console.error(error);
      setState('خطا: ' + (error.message || error));
      connectButton.disabled = false;
    }
  }

  function videoPoint(clientX, clientY) {
    const rect = video.getBoundingClientRect();
    const sourceW = video.videoWidth || rect.width;
    const sourceH = video.videoHeight || rect.height;
    const scale = Math.min(rect.width / sourceW, rect.height / sourceH);
    const shownW = sourceW * scale;
    const shownH = sourceH * scale;
    const left = rect.left + (rect.width - shownW) / 2;
    const top = rect.top + (rect.height - shownH) / 2;
    return {
      x: Math.max(0, Math.min(1, (clientX - left) / shownW)),
      y: Math.max(0, Math.min(1, (clientY - top) / shownH))
    };
  }

  async function sendTouch(start, end, duration) {
    try {
      await fetch('/touch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x1: start.x, y1: start.y, x2: end.x, y2: end.y, duration })
      });
    } catch (error) { console.warn('Touch request failed', error); }
  }

  video.addEventListener('pointerdown', event => {
    if (!video.srcObject) return;
    event.preventDefault();
    video.setPointerCapture(event.pointerId);
    pointerStart = { point: videoPoint(event.clientX, event.clientY), time: performance.now() };
  });
  video.addEventListener('pointerup', event => {
    if (!pointerStart) return;
    event.preventDefault();
    const end = videoPoint(event.clientX, event.clientY);
    const duration = Math.max(55, Math.min(900, performance.now() - pointerStart.time));
    sendTouch(pointerStart.point, end, duration);
    pointerStart = null;
  });
  video.addEventListener('pointercancel', () => { pointerStart = null; });

  async function sendKey(key) {
    try {
      await fetch('/key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key })
      });
    } catch (error) { console.warn(error); }
  }

  connectButton.addEventListener('click', connect);
  document.getElementById('back').addEventListener('click', () => sendKey('back'));
  document.getElementById('home').addEventListener('click', () => sendKey('home'));
  document.getElementById('recents').addEventListener('click', () => sendKey('recents'));
  document.getElementById('fullscreen').addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.getElementById('screenWrap').requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) { }
  });
})();
</script>
</body>
</html>
